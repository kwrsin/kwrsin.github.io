<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Light Weight Simple Memo</title>
<meta name="description" content="Light Weight Simple Memo is a fast, offline-ready memo pad for Markdown and HTML. Keep many memos, auto-save, preview, find and replace.">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#2f9e6b">
<meta property="og:type" content="website">
<meta property="og:title" content="Light Weight Simple Memo">
<meta property="og:description" content="A fast, offline-ready memo pad for Markdown and HTML.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<main id="content">
  <header id="bar">
    <h1 class="sr">Light Weight Simple Memo</h1>
    <div id="ttl" aria-live="polite"></div>
    <div class="tools">
      <button id="bNew" title="New (F11)" aria-label="New"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 12v6M9 15h6"/></svg></button>
      <button id="bImp" title="Import (Ctrl+O)" aria-label="Import"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button>
      <button id="bExp" title="Export (Ctrl+S)" aria-label="Export"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button>
      <button id="bFind" title="Find (F9)" aria-label="Find"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg></button>
      <button id="bList" title="List (F10)" aria-label="List"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></button>
      <button id="bPrev" title="Previous memo (Alt+[)" aria-label="Previous memo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="bNext" title="Next memo (Alt+])" aria-label="Next memo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      <label class="sw" title="Preview / Edit (F2)"><input type="checkbox" id="sw" aria-label="Preview"><span></span></label>
      <input type="color" id="bg" title="Background color" aria-label="Background color">
      <button id="bRst" title="Reset background" aria-label="Reset background"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    <a id="bHelp" class="btn" href="help.html" target="_blank" rel="noopener" title="Help" aria-label="Help (opens in a new tab)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg></a>
    </div>
  </header>
  <button id="done" aria-label="Close keyboard" title="Close keyboard"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  <textarea id="ed" spellcheck="false" placeholder="Start typing…" aria-label="Memo" hidden></textarea>
  <article id="pv" aria-label="Preview"></article>
</main>

<dialog id="dFind" aria-label="Find and replace">
  <button class="x" id="xF" aria-label="Close">✕</button>
  <div class="grid">
    <label for="kw">Keyword</label><input id="kw" class="wide" autocomplete="off" placeholder="Enter = find next">
    <label for="rp">Replacement</label><input id="rp" autocomplete="off"><button id="bDoRep">Replace</button>
    <label class="chk wide"><input type="checkbox" id="all"> All (replace every match)</label>
    <label class="chk wide"><input type="checkbox" id="cs"> Case sensitive</label>
  </div>
  <p id="st" role="status"></p>
</dialog>

<dialog id="dList" aria-label="Memo list">
  <button class="x" id="xL" aria-label="Close">✕</button>
  <label class="fr">Filter <input id="fl" autocomplete="off"></label>
  <ul id="ul"></ul>
  <div class="foot"><button id="bDelAll">Delete all</button></div>
</dialog>
</body>
</html>
