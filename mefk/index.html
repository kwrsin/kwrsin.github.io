<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MIND ELIXIR for Kwrsin</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #toolbar {
      height: 40px;
      background: #f5f5f5;
      border-bottom: 1px solid #ccc;
      display: flex;
      align-items: center;
      padding: 0 10px;
      box-sizing: border-box;
    }
    #toolbar button {
      margin-right: 6px;
      padding: 6px 12px;
      border: none;
      background: #e0e0e0;
      border-radius: 4px;
      cursor: pointer;
    }
    #toolbar button:hover {
      background: #d0d0d0;
    }
    #map {
      height: calc(100% - 40px); /* ツールバーの高さを引く */
      width: 100%;
      overflow: hidden;
    }
  </style>
  <script src="./libs/jszip.min.js"></script>
  <script src="./libs/FileSaver.min.js"></script>
</head>
<body>
<div id="map"></div>
<div id="toolbar">
  <button id="btn-new">New</button>
  <button id="btn-undo" title="Undo (Ctrl+Z)">⎌ Undo</button>
  <button id="btn-redo" title="Redo (Ctrl+Y)">↷ Redo</button>
  <button id="btn-fold" title="Fold (H)">⤢ Fold</button>
  <button id="btn-export-image">To Image</button>
  <button id="btn-export-dir">To Dir</button>
  <button id="btn-export">Export（JSON）</button>
  <input type="file" id="import" accept=".json">
</div>
<script type="module">
  // import MindElixir from "https://cdn.jsdelivr.net/npm/mind-elixir/dist/MindElixir.js"
  import MindElixir from "./libs/MindElixir.js"

  // 初期データ（初回のみ使用）
  const defaultData = {
    nodeData: {
      id: 'root',
      topic: 'Project',
      root: true,
      children: [
        {
          topic: 'EXAMPLE',
          id: '89ceeef3ad026006',
          direction: 1,
          children: [
            {
              topic: 'DIRECTORY1',
              id: '89cef34977d84b92',
              direction: 0
            },
            {
              topic: 'DIRECTORY2',
              id: '89cef1e969b7634a',
              direction: 0,
              children: [
                {
                  topic: 'FILE.txt',
                  id: '89cef1e968b95de2',
                  note: "#Content\n\nyou can set text lines from Note in contextmenu\n",
                  expanded: false
                }
              ]
            }
          ]
        },
        {
          topic: 'TASKS',
          id: '89cef4c88f5e6526',
          direction: 0,
          children: [
            {
              topic: 'TODO',
              id: '89cf070c8ec2a6f6'
            },
            {
              topic: 'DONE',
              id: '89cf092b2aaeff94'
            },
            {
              topic: 'PENDING',
              id: '89cf0a8de1ff6a23'
            },
            {
              topic: 'ISSUE',
              id: '89cf10a9cdafac5e'
            }
          ]
        }
      ]
    }
  };

  // localStorage からデータを取得
  const savedData = localStorage.getItem('mindmap');
  const mindData = savedData ? JSON.parse(savedData) : defaultData;

  let mind = new MindElixir({
      el: '#map',
      direction: MindElixir.SIDE, // LEFT, RIGHT, SIDE
      draggable: true,
      contextMenu: true,
      contextMenuOption: {
        focus: true,
        link: true,
        extend: [
          {
            name: 'Note',
            onclick: () => {
              const selected = mind.currentNode;
              if (!selected) return;

              const nodeData = selected.nodeObj;
              openNotePopup(nodeData);
            }
          }
        ]
      },
      toolBar: true,
      nodeMenu: true,
      keypress: true,
      allowUndo: true,
      // locale: 'ja',
  })
  mindData.linkData = {}
  mindData.note = {}
  mind.init(mindData)

  // 保存ボタンの処理
  //  document.getElementById('saveBtn').addEventListener('click', () => {
  //    const data = mind.getData(); // 現在のマップデータを取得
  //    localStorage.setItem('mindmap', JSON.stringify(data));
  //    alert('Saved!');
  //  });

  // 自動保存: イベント発生時に localStorage に保存
  const autoSave = () => {
    const data = mind.getData();
    localStorage.setItem('mindmap', JSON.stringify(data));
    console.log('Saved!');
  };

  // 以下のイベントに自動保存を設定
  mind.bus.addListener('operation', operation=>{
      autoSave()
    }
  );

  // 新規作成処理
  document.getElementById('btn-new').addEventListener('click', () => {
    if (confirm('Do you want to discard your current mindmap and create a new one?')) {
      const initialData = {
        nodeData: {
          id: 'root',
          topic: 'New Mindmap',
          root: true,
          children: [],
        },
      }
      mind.enableEdit()
      mindData.linkData = {}
      mindData.note = {}
      mind.init(initialData)
      localStorage.setItem('mindmap-data', JSON.stringify(initialData)) // 自動保存対応
    }
  })

  document.getElementById('btn-export-image').addEventListener('click', () => {
    // mind.toPng().then((dataUrl) => {
    //   const link = document.createElement('a');
    //   link.download = (mind.getRoot().topic || 'mindmap') + '.png';
    //   link.href = dataUrl;
    //   link.click();
    // }).catch((err) => {
    //   console.error("Failed To Export a Image: ", err);
    // });
    const downloadPng = async () => {
      const data = mind.getData();
      const blob = await mind.exportPng() // Get a Blob!
      if (!blob) return
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      const centerTopic = data.nodeData.topic || 'mindmap'
      const fileName = centerTopic.replace(/\s+/g, '_') + '.png'
      a.download = fileName
      a.click()
      URL.revokeObjectURL(url)
    }
    downloadPng()
  });

  // JSON エクスポート
  document.getElementById('btn-export').addEventListener('click', () => {
    const data = mind.getData();
    const json = JSON.stringify(data, null, 2);

    // 中心ノードのタイトルを取得し、ファイル名として使用（空白をアンダースコアに置換）
    const centerTopic = data.nodeData.topic || 'mindmap';
    const fileName = centerTopic.replace(/\s+/g, '_') + '.json';

    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.click();
    URL.revokeObjectURL(url);
  });

  // JSON インポート
  document.getElementById('import').addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const json = JSON.parse(e.target.result);
        mind.init(json);
        localStorage.setItem('mindmap', JSON.stringify(json));
        alert('Mindmap has imported');
      } catch (err) {
        alert('Invalid JSON File');
      }
    };
    reader.readAsText(file);
  });

  // 🎯 ドラッグ＆ドロップによる JSON インポート
  const mapContainer = document.getElementById('map')

  mapContainer.addEventListener('dragover', (e) => {
    e.preventDefault()
    mapContainer.style.border = '2px dashed #007acc'
  })

  mapContainer.addEventListener('dragleave', () => {
    mapContainer.style.border = '1px solid #ccc'
  })

  mapContainer.addEventListener('drop', (e) => {
    e.preventDefault()
    mapContainer.style.border = '1px solid #ccc'

    const file = e.dataTransfer.files[0]
    if (file && file.type === 'application/json') {
      const reader = new FileReader()
      reader.onload = (event) => {
        try {
          const json = JSON.parse(event.target.result)
          mind.init(json)
          mind.enableEdit()
          localStorage.setItem('mindmap-data', JSON.stringify(json))
          alert('Mindmap has imported')
        } catch (err) {
          alert('Failed to read Mindmap')
        }
      }
      reader.readAsText(file)
    }
  })

  // ツールバーのボタンに機能を割り当てる
  document.getElementById('btn-undo').addEventListener('click', () => {
    mind.undo()
  })
  document.getElementById('btn-redo').addEventListener('click', () => {
    mind.redo()
  })
  document.getElementById('btn-fold').addEventListener('click', () => {
    try {
      mind.expandNode(mind.currentNode)
    } catch(err) {
      console.log('Failed to show/hide the node')
    }
  })

  function exportMindToZip(mind) {
    if (!mind || !mind.nodeData) {
      console.error("MindElixir instance or nodeData does not exist.");
      return;
    }

    const zip = new JSZip();

    // 再帰的にフォルダ・ファイルを作成
    function traverse(node, folder) {
      const name = node.topic || "untitled";

      // 子供がいない かつ topic に '.' が含まれる → ファイル
      if ((!node.children || node.children.length === 0) && name.includes(".")) {
        folder.file(name, node.note || ""); // 中身は空
      } else {
        // ディレクトリを作成
        const newFolder = folder.folder(name);
        if (node.children && node.children.length > 0) {
          node.children.forEach(child => traverse(child, newFolder));
        }
      }
    }

    const topName = mind.nodeData.topic || "mind_export";
    const rootFolder = zip.folder(topName);
    if (mind.nodeData.children) {
      mind.nodeData.children.forEach(child => traverse(child, rootFolder));
    }

    // zip 生成してダウンロード
    zip.generateAsync({ type: "blob" }).then(content => {
      saveAs(content, `${topName}.zip`);
    });
  }
  document.getElementById("btn-export-dir").addEventListener("click", () => {
    exportMindToZip(mind);
  });

  // --- キーボードショートカット ---
  document.addEventListener('keydown', (e) => {
    const ctrl = e.ctrlKey || e.metaKey
    const shift = e.shiftKey
    let existingOverlay = document.getElementById("noteOverlay");
    if (existingOverlay) return true;


    if (ctrl && !shift && e.key === 'z') {
      e.preventDefault()
      mind.undo()
      return
    }
    if ((ctrl && e.key === 'y') || (ctrl && shift && e.key === 'Z')) {
      e.preventDefault()
      mind.redo()
      return
    }

    if (e.key === 'h' && mind.currentNode) {
      e.preventDefault()
      try {
        mind.expandNode(mind.currentNode)
      } catch(err) {
        console.log('Failed to show/hide the node')
      }
      return
    }
  })

  function openNotePopup(nodeData) {
    // すでに存在する場合は削除
    let existingOverlay = document.getElementById("noteOverlay");
    if (existingOverlay) existingOverlay.remove();

    // 背景オーバーレイ作成
    const overlay = document.createElement("div");
    overlay.id = "noteOverlay";
    overlay.style.position = "fixed";
    overlay.style.top = "0";
    overlay.style.left = "0";
    overlay.style.width = "100%";
    overlay.style.height = "100%";
    overlay.style.backgroundColor = "rgba(0,0,0,0.5)";
    overlay.style.display = "flex";
    overlay.style.alignItems = "center";
    overlay.style.justifyContent = "center";
    overlay.style.zIndex = "1000";

    // ポップアップボックス作成
    const popup = document.createElement("div");
    popup.style.backgroundColor = "#fff";
    popup.style.padding = "20px";
    popup.style.borderRadius = "8px";
    popup.style.width = "400px";
    popup.style.maxWidth = "90%";
    popup.style.boxShadow = "0 0 10px rgba(0,0,0,0.3)";

    const title = document.createElement('h3')
    title.textContent = nodeData.topic || 'No Title'
    title.style.margin = '0'
    title.style.fontSize = '18px'
    title.style.borderBottom = '1px solid #ddd'
    title.style.paddingBottom = '5px'

    const textarea = document.createElement("textarea");
    textarea.style.width = "100%";
    textarea.style.height = "150px";
    textarea.value = nodeData.note || "";

    const saveButton = document.createElement("button");
    saveButton.textContent = "OK";
    saveButton.style.marginTop = "10px";

    saveButton.onclick = () => {
      nodeData.note = textarea.value; // ノードデータに保存
      autoSave()
      overlay.remove(); // ポップアップを閉じる
      mind.refresh(); // MindElixirを再描画（note更新用）
    };

    const cancelButton = document.createElement("button");
    cancelButton.textContent = "CANCEL";
    cancelButton.style.marginTop = "10px";
    cancelButton.style.marginLeft = "5px";

    cancelButton.onclick = () => {
      overlay.remove();
    };

    popup.appendChild(title)
    popup.appendChild(textarea);
    popup.appendChild(document.createElement("br"));
    popup.appendChild(saveButton);
    popup.appendChild(cancelButton);
    overlay.appendChild(popup);

    document.body.appendChild(overlay);
  }
</script>
</body>
</html>
