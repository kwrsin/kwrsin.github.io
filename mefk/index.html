<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MIND ELIXIR for Kwrsin</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #toolbar {
      height: 40px;
      background: #f5f5f5;
      border-bottom: 1px solid #ccc;
      display: flex;
      align-items: center;
      padding: 0 10px;
      box-sizing: border-box;
    }
    #toolbar button {
      margin-right: 6px;
      padding: 6px 12px;
      border: none;
      background: #e0e0e0;
      border-radius: 4px;
      cursor: pointer;
    }
    #toolbar button:hover {
      background: #d0d0d0;
    }
    #memory {
      margin-left: auto;
      font-size: 16px;
      color: red;
    }
    #memory.saved {
      color: green;
    }
    #map {
      height: calc(100% - 40px); /* ツールバーの高さを引く */
      width: 100%;
      overflow: hidden;
    }
    /* サイドバー */
    #sidebar {
      position: fixed;
      top: 0;
      right: -400px;
      width: 400px;
      height: 100%;
      background: #fff;
      box-shadow: -2px 0 6px rgba(0,0,0,0.3);
      transition: right 0.3s;
      display: flex;
      flex-direction: column;
      z-index: 1000;
    }
    #sidebar.open { right: 0; }

    #sidebar-header-frame {
      display: flex;
      justify-content: space-between;
    }

    #sidebar-header {
      width: 100%;
      padding: 10px;
      background: #f0f0f0;
      font-weight: bold;
    }

    #sidebar-urls > div {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      margin-bottom: 8px;
    }

    #sidebar-urls label {
      width: 76px;
      text-align: right;
      font-size: 14px;
    }

    #sidebar-urls input {
      flex: 1;
      min-height: 20px;
      padding: 4px 6px;
      box-sizing: border-box;
    }

    #sidebar-urls button {
      min-height: 16px;
      padding: 4px 6px;
      white-space: nowrap;
      margin-right: 10px;
    }

    #sidebar-close {
      background: transparent;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: #333;
      transition: color 0.2s ease;
    }

    #sidebar-close:hover {
      color: #e74c3c; /* 赤くなる */
    }

    #sidebar-controls {
      display: flex;
      gap: 10px;
      padding: 5px 10px;
    }

    #sidebar-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: auto;
    }

    #color-options {
      display: flex;
      gap: 6px;
      padding: 6px;
    }

    .color-item {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      font-weight: bold;
      text-align: center;
      min-width: 28px;
    }

    /* 各色サンプル */
    .color-item[data-bg="black"]  { background: black; color: white; }
    .color-item[data-bg="red"]    { background: red; color: white; }
    .color-item[data-bg="blue"]   { background: blue; color: white; }
    .color-item[data-bg="green"]  { background: green; color: white; }
    .color-item[data-bg="orange"] { background: orange; color: white; }
    .color-item[data-bg="gray"]   { background: gray; color: black; }

    .color-item[data-reset="true"] {
      background: #eee;
      color: #333;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #ccc;
    }
    .tab {
      padding: 8px 12px;
      cursor: pointer;
    }
    .tab.active {
      background: #ddd;
      font-weight: bold;
    }

    #editor, #preview {
      flex: 1;
      padding: 10px;
      overflow: auto;
      display: none;
    }
    #editor.active, #preview.active { display: block; }

    textarea {
      width: 100%;
      height: 90%;
      resize: none;
    }
  </style>
  <script src="./libs/jszip.min.js"></script>
  <script src="./libs/FileSaver.min.js"></script>
  <script src="./libs/marked.min.js"></script>
</head>
<body>
<div id="map"></div>
<div id="sidebar">
  <div id="sidebar-header-frame">
    <div id="sidebar-header">Please select one of the nodes.</div>
    <span id="save-status" style="margin-left:auto; padding:6px; font-size:12px; color:green; display:none;">✔ updated</span>
    <button id="sidebar-close">✕</button>
  </div>
  <div id="sidebar-urls">
    <div>
      <label for="sidebar-imageurl">Image URL</label>
      <input id="sidebar-imageurl" type="text">
      <button id="sidebar-imageurl-set" type="button">Set</button>
    </div>
    <div>
      <label for="sidebar-siteurl">Site URL</label>
      <input id="sidebar-siteurl" type="text">
      <button id="sidebar-siteurl-set" type="button">Set</button>
    </div>
  </div>
  <div id="sidebar-controls">
    <div id="color-options">
      <div class="color-item" data-bg="black" data-fg="white" data-title="black">black</div>
      <div class="color-item" data-bg="red" data-fg="white" data-title="red">red</div>
      <div class="color-item" data-bg="blue" data-fg="white" data-title="blue">blue</div>
      <div class="color-item" data-bg="green" data-fg="white" data-title="green">green</div>
      <div class="color-item" data-bg="orange" data-fg="white" data-title="green">orange</div>
      <div class="color-item" data-bg="gray" data-fg="black" data-title="gray">gray</div>
      <div class="color-item" data-reset="true">reset</div>
    </div>
  </div>
  <div class="tabs">
    <div class="tab" data-tab="editor">Edit</div>
    <div class="tab active" data-tab="preview">Preview</div>
  </div>
  <div id="sidebar-content">
    <div id="editor">
      <textarea id="note-text"></textarea>
      <button id="update-btn">Update</button>
    </div>
    <div id="preview" class="active"></div>
  </div>
</div>
<div id="toolbar">
  <button id="btn-new" title="New (Ctrl+n)">New</button>
  <button id="btn-undo" title="Undo (Ctrl+z)">⎌ Undo</button>
  <button id="btn-redo" title="Redo (Ctrl+y)">↷ Redo</button>
  <button id="btn-fold" title="Fold (Ctrl+h)">⤢ Fold</button>
  <button id="btn-save" title="Save (Ctrl+s)">Save</button>
  <button id="btn-note" title="Note (Shift+space)">Note</button>
  <button id="btn-export-image">To Image</button>
  <button id="btn-export-dir">To Dir</button>
  <button id="btn-export" title="Export (Ctrl+e)">Export（JSON）</button>
  <input type="file" id="import" accept=".json">
  <span id="memory">unsaved</span>
</div>
<script type="module">
  // import MindElixir from "https://cdn.jsdelivr.net/npm/mind-elixir/dist/MindElixir.js"
  import MindElixir from "./libs/MindElixir.js"

  // 初期データ（初回のみ使用）
  const defaultData = {
    nodeData: {
      id: 'root',
      topic: 'Project',
      root: true,
      children: [
        {
          topic: 'EXAMPLE',
          id: '89ceeef3ad026006',
          direction: 1,
          children: [
            {
              topic: 'DIRECTORY1',
              id: '89cef34977d84b92',
              direction: 0
            },
            {
              topic: 'DIRECTORY2',
              id: '89cef1e969b7634a',
              direction: 0,
              children: [
                {
                  topic: 'FILE.txt',
                  id: '89cef1e968b95de2',
                  note: "# Content\n\nYou can set the selected text line from the Note as the node's content.\n",
                  expanded: false
                }
              ]
            }
          ]
        },
        {
          topic: 'TASKS',
          id: '89cef4c88f5e6526',
          direction: 0,
          children: [
            {
              topic: 'TODO',
              id: '89cf070c8ec2a6f6'
            },
            {
              topic: 'DONE',
              id: '89cf092b2aaeff94'
            },
            {
              topic: 'PENDING',
              id: '89cf0a8de1ff6a23'
            },
            {
              topic: 'ISSUE',
              id: '89cf10a9cdafac5e'
            }
          ]
        }
      ]
    }
  };

  // localStorage からデータを取得
  const savedData = localStorage.getItem('mindmap');
  const mindData = savedData ? JSON.parse(savedData) : defaultData;

  let mind = new MindElixir({
      el: '#map',
      direction: MindElixir.SIDE, // LEFT, RIGHT, SIDE
      draggable: true,
      contextMenu: true,
//      contextMenuOption: {
//        focus: true,
//        link: true,
//        extend: [
//          {
//            name: 'Note',
//            onclick: () => {
//              const selected = mind.currentNode;
//              if (!selected) return;

//              const nodeData = selected.nodeObj;
//              openNotePopup(nodeData);
//            }
//          }
//        ]
//      },
      toolBar: true,
      nodeMenu: true,
      keypress: true,
      allowUndo: true,
      // locale: 'ja',
  })
  mindData.linkData = {}
  mindData.note = {}
  mind.init(mindData)
  updateSaveStatus(true)
  const sidebar = document.getElementById('sidebar')
  const sidebarHeader = document.getElementById('sidebar-header')
  const noteText = document.getElementById('note-text')
  const preview = document.getElementById('preview')
  const tabs = document.querySelectorAll('.tab')
  const siteurl = document.getElementById('sidebar-siteurl')
  const imageurl = document.getElementById('sidebar-imageurl')

  let currentNode = null

  const renderer = {
    link(href, title, text) {
      const link = marked.Renderer.prototype.link.call(this, href, title, text);
      return link.replace("<a","<a target='_blank' rel='noreferrer' ");
    }
  };

  marked.use({
      renderer
  });

  // タブ切り替え
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'))
      tab.classList.add('active')
      document.querySelectorAll('#editor, #preview').forEach(el => el.classList.remove('active'))
      const target = document.getElementById(tab.dataset.tab)
      target.classList.add('active')

      if (tab.dataset.tab === 'preview') {
        preview.innerHTML = marked.parse(noteText.value || '')
      }
    })
  })


  // 更新ボタン
  document.getElementById('update-btn').onclick = () => {
    if (currentNode) {
      currentNode.note = noteText.value
      autoSave()

      // ✔ saved をフラッシュ表示
      const status = document.getElementById('save-status')
      status.style.display = 'inline'
      setTimeout(() => {
        status.style.display = 'none'
      }, 1500)
    }
  }

  function setNote() {
    if(sidebar.classList.contains('open') == false) return;
    const selected = mind.currentNode;
    if (!selected) return;

    currentNode = selected.nodeObj;
    sidebarHeader.textContent = currentNode.topic
    noteText.value = currentNode.note || ''
    preview.innerHTML = marked.parse(currentNode.note || '')

    // imageurl.value
    siteurl.value = currentNode.hyperLink || ''
    imageurl.value = currentNode.image.url || ''
  }

  function showNote() {
    sidebar.classList.add('open')
  }

  function hideNote() {
    sidebar.classList.remove('open')
  }

  function toggleNote() {
    sidebar.classList.toggle('open')
  }

  // ノード選択イベント
  mind.bus.addListener('selectNode', node => {
    setNote()
  })

  mind.bus.addListener('operation', op => {
    setNote()
  })

  // 保存ボタンの処理
  //  document.getElementById('saveBtn').addEventListener('click', () => {
  //    const data = mind.getData(); // 現在のマップデータを取得
  //    localStorage.setItem('mindmap', JSON.stringify(data));
  //    alert('Saved!');
  //  });

  // 自動保存: イベント発生時に localStorage に保存
  const autoSave = () => {
    const data = mind.getData();
    localStorage.setItem('mindmap', JSON.stringify(data));
    updateSaveStatus(true)
    console.log('Saved!');
  };

  // 以下のイベントに自動保存を設定
  mind.bus.addListener('operation', operation=>{
      autoSave()
    }
  );

  function createMap() {
    if (confirm('Do you want to discard your current mindmap and create a new one?')) {
      const initialData = {
        nodeData: {
          id: 'root',
          topic: 'New Mindmap',
          root: true,
          children: [],
        },
      }
      mind.enableEdit()
      mindData.linkData = {}
      mindData.note = {}
      mind.init(initialData)
      updateSaveStatus(false)
    }
  }

  // 新規作成処理
  document.getElementById('btn-new').addEventListener('click', () => {
    createMap()
  })

  document.getElementById('btn-export-image').addEventListener('click', () => {
    // mind.toPng().then((dataUrl) => {
    //   const link = document.createElement('a');
    //   link.download = (mind.getRoot().topic || 'mindmap') + '.png';
    //   link.href = dataUrl;
    //   link.click();
    // }).catch((err) => {
    //   console.error("Failed To Export a Image: ", err);
    // });
    const downloadPng = async () => {
      const data = mind.getData();
      const blob = await mind.exportPng() // Get a Blob!
      if (!blob) return
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      const centerTopic = data.nodeData.topic || 'mindmap'
      const fileName = centerTopic.replace(/\s+/g, '_') + '.png'
      a.download = fileName
      a.click()
      URL.revokeObjectURL(url)
    }
    downloadPng()
  });

  function exportToJSON() {
    const data = mind.getData();
    const json = JSON.stringify(data, null, 2);

    // 中心ノードのタイトルを取得し、ファイル名として使用（空白をアンダースコアに置換）
    const centerTopic = data.nodeData.topic || 'mindmap';
    const fileName = centerTopic.replace(/\s+/g, '_') + '.json';

    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.click();
    URL.revokeObjectURL(url);
  }

  // JSON エクスポート
  document.getElementById('btn-export').addEventListener('click', () => {
    exportToJSON()
  });

  // JSON インポート
  document.getElementById('import').addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const json = JSON.parse(e.target.result);
        mind.init(json);
        updateSaveStatus(false)
        alert('Mindmap has imported');
      } catch (err) {
        alert('Invalid JSON File');
      }
    };
    reader.readAsText(file);
  });

  // 🎯 ドラッグ＆ドロップによる JSON インポート
  const mapContainer = document.getElementById('map')

  mapContainer.addEventListener('dragover', (e) => {
    e.preventDefault()
    mapContainer.style.border = '2px dashed #007acc'
  })

  mapContainer.addEventListener('dragleave', () => {
    mapContainer.style.border = '1px solid #ccc'
  })

  mapContainer.addEventListener('drop', (e) => {
    e.preventDefault()
    mapContainer.style.border = '1px solid #ccc'

    const file = e.dataTransfer.files[0]
    if (file && file.type === 'application/json') {
      const reader = new FileReader()
      reader.onload = (event) => {
        try {
          const json = JSON.parse(event.target.result)
          mind.init(json)
          mind.enableEdit()
          updateSaveStatus(false)
          alert('Mindmap has imported')
        } catch (err) {
          alert('Failed to read Mindmap')
        }
      }
      reader.readAsText(file)
    }
  })

  // ツールバーのボタンに機能を割り当てる
  document.getElementById('btn-undo').addEventListener('click', () => {
    mind.undo()
  })
  document.getElementById('btn-redo').addEventListener('click', () => {
    mind.redo()
  })
  document.getElementById('btn-fold').addEventListener('click', () => {
    try {
      mind.expandNode(mind.currentNode)
    } catch(err) {
      console.log('Failed to show/hide the node')
    }
  })
  document.getElementById('btn-save').addEventListener('click', () => {
    autoSave()
  })
  document.getElementById('btn-note').addEventListener('click', () => {
    toggleNote()
  })

  function exportMindToZip(mind) {
    if (!mind || !mind.nodeData) {
      console.error("MindElixir instance or nodeData does not exist.");
      return;
    }

    const zip = new JSZip();

    // 再帰的にフォルダ・ファイルを作成
    function traverse(node, folder) {
      const name = node.topic || "untitled";

      // 子供がいない かつ topic に '.' が含まれる → ファイル
      if ((!node.children || node.children.length === 0) && name.includes(".")) {
        folder.file(name, node.note || ""); // 中身は空
      } else {
        // ディレクトリを作成
        const newFolder = folder.folder(name);
        if (node.children && node.children.length > 0) {
          node.children.forEach(child => traverse(child, newFolder));
        }
      }
    }

    const topName = mind.nodeData.topic || "mind_export";
    const rootFolder = zip.folder(topName);
    if (mind.nodeData.children) {
      mind.nodeData.children.forEach(child => traverse(child, rootFolder));
    }

    // zip 生成してダウンロード
    zip.generateAsync({ type: "blob" }).then(content => {
      saveAs(content, `${topName}.zip`);
    });
  }
  document.getElementById("btn-export-dir").addEventListener("click", () => {
    exportMindToZip(mind);
  });

  document.getElementById('sidebar-close').addEventListener('click', () => {
    toggleNote()
  })

  function isValidHttpUrl(str) {
    try {
      const url = new URL(str);
      return url.protocol === "http:" || url.protocol === "https:";
    } catch (e) {
      return false;
    }
  }
  document.getElementById('sidebar-imageurl-set').addEventListener('click', () => {
    function getImageSize(url, callback) {
      const img = new Image();
      img.onload = function() {
        callback({ width: img.width, height: img.height });
      };
      img.onerror = function() {
        callback(null);
      };
      img.src = url;
    }
    const selected = mind.currentNode;
    if (!selected) return;
    const url = imageurl.value || "";
    if(url.length <= 0) {
      mind.reshapeNode(selected, { image: {} });
      return
    }
    if(isValidHttpUrl(url) == false) return
    getImageSize(url, size => {
      if(size) {
        mind.reshapeNode(selected, {
          image: {
            url: url,
            width: size.width,
            height: size.height,
            fit: 'cover'
          }
        });
      }
    })
  })

  document.getElementById('sidebar-siteurl-set').addEventListener('click', () => {
    const selected = mind.currentNode;
    if (!selected) return;
    currentNode = selected;
    const url = siteurl.value || "";
    if(url.length <= 0) {
      mind.reshapeNode(selected, { hyperLink: null });
      return
    }
    if(isValidHttpUrl(url) == false) return
    mind.reshapeNode(selected, { hyperLink: url });
  })

  document.querySelectorAll('.color-item').forEach(item => {
    item.addEventListener('click', () => {
      const selected = mind.currentNode;
      if (!selected) return;


      if (item.dataset.reset) {
        // リセット（元に戻す）
          delete selected.nodeObj.style;  // style を削除
          mind.reshapeNode(selected, { style: {} });
      } else {
        const bg = item.dataset.bg;
        const fg = item.dataset.fg;
        const title = item.dataset.title;

        // ノードの style を変更
        const style = {
          background: bg,
          color: fg,
          border: `2px solid ${title}`
        };
        mind.reshapeNode(selected, { style: style });
      }
    });
  });

  // --- キーボードショートカット ---
  document.addEventListener('keydown', (e) => {
    const ctrl = e.ctrlKey || e.metaKey
    const shift = e.shiftKey
    let existingOverlay = document.getElementById("noteOverlay");
    if (existingOverlay) return true;

    if (shift && e.key === ' ') {
      e.preventDefault()
      toggleNote()
      setNote()
      return
    }

    if(sidebar.classList.contains('open')) return true;

    if (ctrl && !shift && e.key === 'z') {
      e.preventDefault()
      mind.undo()
      return
    }
    if ((ctrl && e.key === 'y') || (ctrl && shift && e.key === 'Z')) {
      e.preventDefault()
      mind.redo()
      return
    }

    if ((ctrl && e.key === 'h') && mind.currentNode) {
      e.preventDefault()
      try {
        mind.expandNode(mind.currentNode)
      } catch(err) {
        console.log('Failed to show/hide the node')
      }
      return
    }

    if ((ctrl && e.key === 'e')) {
      e.preventDefault()
      exportToJSON()
      return
    }

    if ((ctrl && e.key === 'n')) {
      e.preventDefault()
      createMap()
      return
    }

    if ((ctrl && e.key === 's')) {
      e.preventDefault()
      autoSave()
      return
    }

    return true
  })

  function openNotePopup(nodeData) {
    // すでに存在する場合は削除
    let existingOverlay = document.getElementById("noteOverlay");
    if (existingOverlay) existingOverlay.remove();

    // 背景オーバーレイ作成
    const overlay = document.createElement("div");
    overlay.id = "noteOverlay";
    overlay.style.position = "fixed";
    overlay.style.top = "0";
    overlay.style.left = "0";
    overlay.style.width = "100%";
    overlay.style.height = "100%";
    overlay.style.backgroundColor = "rgba(0,0,0,0.5)";
    overlay.style.display = "flex";
    overlay.style.alignItems = "center";
    overlay.style.justifyContent = "center";
    overlay.style.zIndex = "1000";

    // ポップアップボックス作成
    const popup = document.createElement("div");
    popup.style.backgroundColor = "#fff";
    popup.style.padding = "20px";
    popup.style.borderRadius = "8px";
    popup.style.width = "400px";
    popup.style.maxWidth = "90%";
    popup.style.boxShadow = "0 0 10px rgba(0,0,0,0.3)";

    const title = document.createElement('h3')
    title.textContent = nodeData.topic || 'No Title'
    title.style.margin = '0'
    title.style.fontSize = '18px'
    title.style.borderBottom = '1px solid #ddd'
    title.style.paddingBottom = '5px'

    const textarea = document.createElement("textarea");
    textarea.style.width = "100%";
    textarea.style.height = "150px";
    textarea.value = nodeData.note || "";

    const saveButton = document.createElement("button");
    saveButton.textContent = "OK";
    saveButton.style.marginTop = "10px";

    saveButton.onclick = () => {
      nodeData.note = textarea.value; // ノードデータに保存
      autoSave()
      overlay.remove(); // ポップアップを閉じる
      mind.refresh(); // MindElixirを再描画（note更新用）
    };

    const cancelButton = document.createElement("button");
    cancelButton.textContent = "CANCEL";
    cancelButton.style.marginTop = "10px";
    cancelButton.style.marginLeft = "5px";

    cancelButton.onclick = () => {
      overlay.remove();
    };

    popup.appendChild(title)
    popup.appendChild(textarea);
    popup.appendChild(document.createElement("br"));
    popup.appendChild(saveButton);
    popup.appendChild(cancelButton);
    overlay.appendChild(popup);

    document.body.appendChild(overlay);
  }

  function updateSaveStatus(saved = false) {
    const label = document.getElementById("memory");
    if (saved) {
      label.textContent = "✔ saved";
      label.style.color = "green";
    } else {
      label.textContent = "unsaved";
      label.style.color = "red";
    }
  }
</script>
</body>
</html>
